<div class="min-h-screen flex flex-col lg:flex-row">

    <main class="flex-1 flex flex-col items-center justify-center gap-6 p-10">
        <div class="text-center">
            <h1 class="text-4xl font-bold tracking-tight">📅 Calenda</h1>
            <p class="text-base-content/60 text-sm mt-1">Your personal scheduling companion</p>
        </div>

        @if (userRegister()) {
            <app-register/>
            <p class="text-sm text-base-content/70">
                Already have an account?
                <a class="link link-primary font-medium" href="#" (click)="userRegister.set(false)">Login here</a>
            </p>
        } @else {
            <app-login/>
            <p class="text-sm text-base-content/70">
                Don't have an account?
                <a class="link link-primary font-medium" href="#" (click)="userRegister.set(true)">Register here</a>
            </p>
        }
    </main>

    <div class="divider lg:divider-horizontal"></div>

    <aside class="flex-1 flex flex-col items-center justify-center gap-6 p-10 bg-base-200">
        <div class="text-center">
            <h2 class="text-2xl font-semibold">Stay organized</h2>
            <p class="text-base-content/60 text-sm mt-1">Manage your schedule effortlessly</p>
        </div>

        <app-calendar/>
    </aside>

</div>

<router-outlet />
